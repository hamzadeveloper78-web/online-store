<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="4.css">
  <title>نسيت كلمة المرور</title>
</head>
<body>

  <main class="auth-card">
    <header class="auth-header">
      <h1>استعادة كلمة المرور</h1>
    </header>

    <form class="auth-form" action="#" method="POST">
      <div class="form-group">
        <label for="reset-email">البريد الإلكتروني</label>
        <input id="reset-email" class="form-input" type="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="reset-code">رمز التحقق</label>
        <input id="reset-code" class="form-input" type="text" placeholder="أدخل الرمز" required>
      </div>

      <a href="forgetpassword.html" class="forgot-link">لم أتلقَّ الكود؟ إعادة إرسال</a>

      <button class="btn-submit" type="submit">إرسال الرمز</button>
    </form>

    <footer class="auth-footer">
      <span>الرجوع للصفحة السابقة؟</span>
      <a href="log_in.html">تسجيل الدخول</a>
    </footer>
  </main>

</body>
</html>
