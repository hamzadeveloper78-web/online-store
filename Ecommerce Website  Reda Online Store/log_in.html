<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="4.css">
  <title>تسجيل الدخول</title>
</head>
<body>

  <main class="auth-card">
    <header class="auth-header">
      <h1>تسجيل الدخول</h1>
    </header>

    <form class="auth-form" action="#" method="POST">
      <div class="form-group">
        <label for="login-email">البريد الإلكتروني</label>
        <input id="login-email" class="form-input" type="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="login-pass">كلمة المرور</label>
        <input id="login-pass" class="form-input" type="password" placeholder="enter password" required>
      </div>

      <a href="forgetpassword.html" class="forgot-link">نسيت كلمة المرور؟</a>

      <button class="btn-submit" type="submit">تسجيل الدخول</button>
    </form>

    <footer class="auth-footer">
      <span>ليس لديك حساب؟</span>
      <a href="create_account.html">إنشاء حساب جديد</a>
    </footer>
  </main>

</body>
</html>
